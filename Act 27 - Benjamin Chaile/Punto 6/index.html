<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 6</title>
    <script src="/Punto 6/src/punto6.js" defer></script>
</head>
<body>

    <li id="formulario">
        <p>1- ¿Cuál es la capital de Francia?</p>
        <select id="p1">
            <option value="0">Seleccione</option>
            <option value="correcta">París</option>
            <option value="incorrecta">Madrid</option>
            <option value="incorrecta">Roma</option>
        </select><br><br>

        <p>2- ¿Cuánto es 5 + 3?</p>
        <select id="p2">
            <option value="0">Seleccione</option>
            <option value="incorrecta">7</option>
            <option value="correcta">8</option>
            <option value="incorrecta">9</option>
        </select><br><br>

        <p>3- ¿Qué lenguaje se ejecuta en el navegador?</p>
        <select id="p3">
            <option value="0">Seleccione</option>
            <option value="incorrecta">Python</option>
            <option value="incorrecta">Java</option>
            <option value="correcta">JavaScript</option>
        </select><br><br>

        <p>4- ¿Cuál es el planeta más cercano al Sol?</p>
        <select id="p4">
            <option value="0">Seleccione</option>
            <option value="incorrecta">Venus</option>
            <option value="correcta">Mercurio</option>
            <option value="incorrecta">Tierra</option>
        </select><br><br>

        <button id="boton">Calcular</button><br>
        Correctas: <input type="text" id="correctas" readonly><br>
        Incorrectas: <input type="text" id="incorrectas" readonly>
    </li>

</body>
</html>
