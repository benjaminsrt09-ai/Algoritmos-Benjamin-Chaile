<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto 4</title>
    <script src = "src/punto4.js" defer></script>
</head>
<body>

    <h3>Accesos a Web-Mail</h3>
<table border="1" cellpadding="20">
    <tr>
        <td onMouseOver="pintar(this, '#ffcccc')" onMouseOut="pintar(this, '#ffffff')">
            <a href="https://mail.google.com" target="_blank">Gmail</a>
        </td>
        <td onMouseOver="pintar(this, '#ccffcc')" onMouseOut="pintar(this, '#ffffff')">
            <a href="https://outlook.live.com" target="_blank">Hotmail</a>
        </td>
        <td onMouseOver="pintar(this, '#ccccff')" onMouseOut="pintar(this, '#ffffff')">
            <a href="https://mail.yahoo.com" target="_blank">Yahoo!</a>
        </td>
    </tr>
</table>

</body>
</html>
